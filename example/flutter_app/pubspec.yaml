name: dartvex_flutter_demo
description: Demo app wiring dartvex, dartvex_codegen, and dartvex_flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  dartvex:
    path: ../../packages/dartvex
  dartvex_flutter:
    path: ../../packages/dartvex_flutter
  dartvex_local:
    path: ../../packages/dartvex_local
  dartvex_auth_better:
    path: ../../packages/dartvex_auth_better
  dartvex_auth2_convex:
    path: ../../packages/dartvex_auth2_convex
  cupertino_icons: ^2.0.0
  flutter_svg: ^2.3.0
  path_provider: ^2.1.5
  material_ui: ^1.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.5.0
  flutter_launcher_icons: ^0.14.0

dependency_overrides:
  dartvex:
    path: ../../packages/dartvex

flutter:
  uses-material-design: true
  assets:
    - assets/dartvex-logo.svg
    - assets/sample/

# App launcher icons generated from the Dartvex logo with `flutter_launcher_icons`.
# Regenerate after changing the masters in assets/icon/ with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/dartvex_icon.png"
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/dartvex_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    image_path: "assets/icon/dartvex_icon.png"
    background_color: "#ffffff"
    theme_color: "#0372b9"
  macos:
    generate: true
    image_path: "assets/icon/dartvex_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/dartvex_icon.png"
    icon_size: 256
