name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run on the latest stable SDKs, so SDK/dependency drift on main
    # shows up even when nothing is pushed. Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.x', channel: stable }
      - name: Resolve packages
        run: |
          for dir in packages/*/; do
            bash scripts/ci-local-dependency-overrides.sh "$dir"
            if grep -q 'sdk: flutter' "$dir/pubspec.yaml"; then
              (cd "$dir" && flutter pub get)
            else
              (cd "$dir" && dart pub get)
            fi
          done
          (cd example/flutter_app && flutter pub get)
      - name: Format check (excluding generated goldens)
        run: |
          for dir in packages/*/ example/flutter_app/; do
            (
              cd "$dir"
              paths=()
              for candidate in lib test tool bin; do
                if [ -d "$candidate" ]; then
                  paths+=("$candidate")
                fi
              done

              if [ "${#paths[@]}" -gt 0 ]; then
                find "${paths[@]}" -path '*/goldens/*' -prune -o -name '*.dart' -print0 \
                  | xargs -0r dart format --set-exit-if-changed
              fi
            )
          done

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [dartvex, dartvex_codegen, dartvex_local, dartvex_auth_better]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Use local dartvex dependency
        if: matrix.package != 'dartvex'
        run: bash scripts/ci-local-dependency-overrides.sh packages/${{ matrix.package }}
      - run: cd packages/${{ matrix.package }} && dart pub get && dart analyze --fatal-infos

  analyze-flutter:
    name: Analyze (Flutter)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [dartvex_flutter]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.x', channel: stable }
      - name: Use local dartvex dependency
        run: bash scripts/ci-local-dependency-overrides.sh packages/${{ matrix.package }}
      - run: cd packages/${{ matrix.package }} && flutter pub get && flutter analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [dartvex, dartvex_codegen, dartvex_local, dartvex_auth_better]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Use local dartvex dependency
        if: matrix.package != 'dartvex'
        run: bash scripts/ci-local-dependency-overrides.sh packages/${{ matrix.package }}
      - name: Install dependencies
        run: cd packages/${{ matrix.package }} && dart pub get
      - name: Regenerate golden files
        if: matrix.package == 'dartvex_codegen'
        run: cd packages/dartvex_codegen && dart run tool/update_goldens.dart
      # The regen step keeps goldens independent of the unpinned formatter, so
      # the golden comparison alone cannot catch broken output. Generate the
      # fixture through the real CLI and analyze it against the local dartvex
      # package (test/goldens is excluded from the package analysis).
      - name: Analyze generated bindings
        if: matrix.package == 'dartvex_codegen'
        run: |
          cd packages/dartvex_codegen
          dart run dartvex_codegen generate \
            --spec-file test/fixtures/function_spec.json \
            --output build/generated_check
          dart analyze --fatal-warnings build/generated_check
      - run: cd packages/${{ matrix.package }} && dart test

  test-flutter:
    name: Test (Flutter)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [dartvex_flutter]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.x', channel: stable }
      - name: Use local dartvex dependency
        run: bash scripts/ci-local-dependency-overrides.sh packages/${{ matrix.package }}
      - run: cd packages/${{ matrix.package }} && flutter pub get && flutter test

  package-flutter-example:
    name: Package Flutter Example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.x', channel: stable }
      - name: Use local dartvex dependency
        run: bash scripts/ci-local-dependency-overrides.sh packages/dartvex_flutter
      - run: cd packages/dartvex_flutter/example && flutter pub get
      - run: cd packages/dartvex_flutter/example && flutter analyze --fatal-infos
      - run: cd packages/dartvex_flutter/example && flutter test
      - run: cd packages/dartvex_flutter/example && flutter build web

  example-flutter:
    name: Example Flutter App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.x', channel: stable }
      - run: cd example/flutter_app && flutter pub get
      - run: cd example/flutter_app && flutter analyze --fatal-infos
      - run: cd example/flutter_app && flutter test
      - run: cd example/flutter_app && flutter build web

  # Declared SDK floors: the lowest Dart/Flutter each package's pubspec
  # accepts. `pub downgrade` + analyze checks the lower bounds of every
  # dependency constraint; the tests then run on the floor SDK with a normal
  # resolution (the lowest versions of some transitive dev dependencies, such
  # as pub_semver or watcher, do not compile on these SDKs).
  min-sdk:
    name: Minimum SDK (${{ matrix.package }}, ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: dartvex
            sdk: '3.6.0'
          - package: dartvex_auth_better
            sdk: '3.6.0'
          - package: dartvex_codegen
            sdk: '3.7.0'
          - package: dartvex_local
            sdk: '3.10.0'
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with: { sdk: '${{ matrix.sdk }}' }
      - name: Use local dartvex dependency
        if: matrix.package != 'dartvex'
        run: bash scripts/ci-local-dependency-overrides.sh packages/${{ matrix.package }}
      - name: Analyze with the lowest allowed dependencies
        run: cd packages/${{ matrix.package }} && dart pub downgrade && dart analyze
      - name: Test on the floor SDK
        run: cd packages/${{ matrix.package }} && dart pub upgrade && dart test

  min-sdk-flutter:
    name: Minimum SDK (dartvex_flutter, Flutter 3.38.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Flutter 3.38's native-assets step looks for clang++ even when no
      # package builds native code on Linux.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      # 3.38.0 shipped a prerelease Dart (3.10.0-290.4.beta) that `sdk: ^3.10.0`
      # rejects, so 3.38.1 is the first usable 3.38 release.
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.38.1', channel: stable }
      - name: Use local dartvex dependency
        run: bash scripts/ci-local-dependency-overrides.sh packages/dartvex_flutter
      - name: Analyze with the lowest allowed dependencies
        run: cd packages/dartvex_flutter && flutter pub downgrade && flutter analyze
      - name: Test on the floor SDK
        run: cd packages/dartvex_flutter && flutter pub upgrade && flutter test

  protocol-watch:
    name: Protocol Watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Structural check only; new Convex releases are reported by the weekly
      # protocol-watch workflow instead of failing pull requests.
      - run: ./scripts/protocol-watch.sh --structure-only

  web-compile:
    name: Web Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: cd packages/dartvex && dart pub get
      - name: Compile web transport test with dart2js
        run: |
          cd packages/dartvex
          dart compile js -O0 test/transport/web_transport_test.dart \
            -o /tmp/dartvex_web_transport_test.js

  publish-dry-run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: dartvex
            tool: dart
          - package: dartvex_codegen
            tool: dart
          - package: dartvex_local
            tool: dart
          - package: dartvex_flutter
            tool: flutter
          - package: dartvex_auth_better
            tool: dart
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        if: matrix.tool == 'dart'
        with: { sdk: stable }
      - uses: subosito/flutter-action@v2
        if: matrix.tool == 'flutter'
        with: { flutter-version: '3.x', channel: stable }
      - name: Use local dartvex dependency
        if: matrix.package != 'dartvex'
        run: bash scripts/ci-local-dependency-overrides.sh packages/${{ matrix.package }}
      - name: Publish dry-run (Dart)
        if: matrix.tool == 'dart'
        run: cd packages/${{ matrix.package }} && dart pub get && dart pub publish --dry-run
      - name: Publish dry-run (Flutter)
        if: matrix.tool == 'flutter'
        run: cd packages/${{ matrix.package }} && flutter pub get && flutter pub publish --dry-run
