  Convex Auth (@convex-dev/auth v2) adapter for Dartvex. Sign in with
  Convex Auth methods and keep rotating sessions in sync with the client.
version: 0.1.0
homepage: https://github.com/AndreFrelicot/dartvex
repository: https://github.com/AndreFrelicot/dartvex/tree/main/packages/dartvex_auth_convex
